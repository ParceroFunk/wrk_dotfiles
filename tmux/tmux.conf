# ── Prefix: Ctrl+Space ──────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0          # no delay for Esc (important for Neovim)
set -g focus-events on         # lets Neovim detect focus changes
set -g set-clipboard on
set -g status-interval 5
setw -g mode-keys vi

# ── Reload config ───────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Windows and splits (keep current path) ──────────
unbind '"'
unbind %
bind c new-window   -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ─────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing (repeatable) ──────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ───────────────────────────────
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# ── Copy mode (vi-style, WSL clipboard) ─────────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# ── Status bar (minimal) ────────────────────────────
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bold] #S  "
set -g status-right "%H:%M  %d-%b "
setw -g window-status-current-style "fg=#89b4fa,bold"
